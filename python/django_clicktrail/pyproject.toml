[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-clicktrail"
version = "0.1.0rc3"
description = "Django integration for ClickTrail: attribution middleware, template tags, and conversion shortcuts."
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Vizuh OÜ" }]
requires-python = ">=3.10"
keywords = ["clicktrail", "django", "attribution", "analytics"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django>=4.2"]

[project.optional-dependencies]
dev = ["clicktrail", "pytest"]

[project.urls]
Homepage = "https://github.com/vizuh/clicktrail-js"

[tool.setuptools]
include-package-data = true

# The integration ships as the `clicktrail_django` subpackage of the shared
# `clicktrail_django` package so `INSTALLED_APPS = [..., "clicktrail_django"]`.
[tool.setuptools.packages.find]
where = ["src"]
include = ["clicktrail_django*"]
namespaces = true
