[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clicktrail"
version = "0.1.0rc3"
description = "ClickTrail attribution SDK for Python servers: canonical events, stable idempotent event ids, never-raise delivery."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ClickTrail contributors" }]
keywords = ["analytics", "attribution", "clicktrail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vizuh/clicktrail"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["clicktrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
