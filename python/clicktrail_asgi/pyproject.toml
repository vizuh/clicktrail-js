[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clicktrail-asgi"
version = "0.1.0"
description = "Pure-ASGI ClickTrail middleware: query attribution + scoped send helper, zero framework imports."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ClickTrail contributors" }]
keywords = ["asgi", "analytics", "attribution", "clicktrail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vizuh/clicktrail"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["clicktrail_asgi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
