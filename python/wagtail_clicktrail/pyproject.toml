[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-clicktrail"
version = "0.1.0rc3"
description = "Wagtail integration for ClickTrail: form submissions become leads, signups become identified visitors."
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Vizuh OÜ" }]
requires-python = ">=3.10"
keywords = ["clicktrail", "wagtail", "django", "attribution", "analytics"]
classifiers = [
    "Framework :: Django",
    "Framework :: Wagtail",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["wagtail>=4.1", "clicktrail"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/vizuh/clicktrail-js"

[tool.setuptools.packages.find]
where = ["src"]
