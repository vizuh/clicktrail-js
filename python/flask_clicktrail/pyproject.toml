[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-clicktrail"
version = "0.1.0"
description = "Flask extension: after_request attribution capture into flask.g + ClickTrail track_conversion helper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ClickTrail contributors" }]
keywords = ["flask", "analytics", "attribution", "clicktrail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vizuh/clicktrail"

[project.optional-dependencies]
dev = ["flask>=2.0", "pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["flask_clicktrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
