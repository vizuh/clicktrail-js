name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      require_parity:
        description: Fail unless the pinned WordPress plugin checkout is available
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + test + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict typecheck (tsc --noEmit)
        run: pnpm -r exec tsc -p tsconfig.json --noEmit

      - name: Test (vitest)
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  integration:
    name: Browser probe + parity + pack smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned WP plugin for required parity
        if: inputs.require_parity == true
        uses: actions/checkout@v4
        with:
          repository: vizuh/click-trail-handler
          ref: f720bc9e586e730f777d52cd5a2b77ffb67d49d6
          path: click-trail-handler
          fetch-depth: 1

      # Parity accepts either the pinned hosted checkout above or a sibling
      # checkout on a self-hosted runner.
      - name: Check WP plugin source availability
        id: plugin
        run: |
          if [ -f "../click-trail-handler/assets/js/clicutcl-attribution.js" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=$(realpath ../click-trail-handler)" >> "$GITHUB_OUTPUT"
          elif [ -f "click-trail-handler/assets/js/clicutcl-attribution.js" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=$(realpath click-trail-handler)" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Parity harness NOT executed"
              echo ""
              echo "The WP parity harness requires click-trail-handler at a sibling"
              echo "checkout or via workflow_dispatch -> require_parity=true."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::parity harness skipped: click-trail-handler checkout absent"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build ESM + IIFE global bundle
        run: |
          pnpm --filter @vizuh/clicktrail build
          pnpm --filter @vizuh/clicktrail build:global

      - name: Playwright golden-fixture probe
        run: node probe/run-probe.mjs

      - name: WP runtime parity harness
        if: steps.plugin.outputs.available == 'true'
        run: pnpm parity
        env:
          CLICKTRAIL_WP_PLUGIN_ROOT: ${{ steps.plugin.outputs.root }}

      - name: Enforce required parity (workflow_dispatch only)
        if: inputs.require_parity == true && steps.plugin.outputs.available != 'true'
        run: |
          echo "::error::require_parity=true but click-trail-handler is unavailable."
          exit 1

      - name: npm pack + clean-room install smoke
        run: |
          cd packages/clicktrail
          npm pack --pack-destination /tmp
          cd "$(mktemp -d)"
          echo '{"name":"smoke","type":"module","private":true}' > package.json
          npm install /tmp/vizuh-clicktrail-*.tgz --silent
          node --input-type=module -e "
            const mod = await import('@vizuh/clicktrail');
            const browser = await import('@vizuh/clicktrail/browser');
            const conv = await import('@vizuh/clicktrail/conversation');
            const agent = await import('@vizuh/clicktrail/agent');
            const otel = await import('@vizuh/clicktrail/otel');
            const apointoo = await import('@vizuh/clicktrail/apointoo');
            const incubating = await import('@vizuh/clicktrail/incubating');
            const checks = [
              ['root', mod.parseAttributionUrl],
              ['browser', browser.createClickTrail],
              ['conversation', conv.createConversationTracker],
              ['agent', agent.createAgentRunRecorder],
              ['otel', otel.otelDestination],
              ['apointoo', apointoo.createApointooDestination],
              ['incubating', incubating.ATTR_JOURNEY_ID],
            ];
            const missing = checks.filter(([, value]) => value === undefined).map(([name]) => name);
            if (missing.length) {
              console.error('Missing package exports:', missing.join(', '));
              process.exit(1);
            }
            console.log('pack smoke OK, exports', checks.map(([name]) => name).join(', '));
          "
