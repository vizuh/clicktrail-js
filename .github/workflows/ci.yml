name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      require_parity:
        description: Fail unless the pinned WordPress plugin checkout is available
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Typecheck + test + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Production dependency audit
        if: matrix.node == 22
        run: pnpm audit --prod --audit-level high

  integration:
    name: ${{ matrix.browser }} probe + parity + pack smoke
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout pinned WP plugin for required parity
        if: inputs.require_parity == true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: vizuh/click-trail-handler
          ref: ead6682d6433c4f27309b7ee412e2dfc1fd50de4
          path: click-trail-handler
          fetch-depth: 1
          persist-credentials: false

      # Parity accepts either the pinned hosted checkout above or a sibling
      # checkout on a self-hosted runner.
      - name: Check WP plugin source availability
        id: plugin
        run: |
          if [ -f "../click-trail-handler/assets/js/clicutcl-attribution.js" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=$(realpath ../click-trail-handler)" >> "$GITHUB_OUTPUT"
          elif [ -f "click-trail-handler/assets/js/clicutcl-attribution.js" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=$(realpath click-trail-handler)" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Parity harness NOT executed"
              echo ""
              echo "The WP parity harness requires click-trail-handler at a sibling"
              echo "checkout or via workflow_dispatch -> require_parity=true."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::parity harness skipped: click-trail-handler checkout absent"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build ESM + IIFE global bundle
        run: |
          pnpm --filter @vizuh/clicktrail... build
          pnpm --filter @vizuh/clicktrail build:global
          pnpm --filter @vizuh/clicktrail-astro build
          pnpm --filter @vizuh/clicktrail-nuxt build
          pnpm --filter @vizuh/clicktrail-sveltekit build
          pnpm --filter @vizuh/clicktrail-server... build
          pnpm --filter @vizuh/clicktrail-formbricks... build

      - name: Playwright golden and WordPress reference probes
        run: |
          node probe/run-probe.mjs
          node probe/run-wordpress-reference.mjs
        env:
          CLICKTRAIL_BROWSER: ${{ matrix.browser }}

      - name: WP runtime parity harness
        if: steps.plugin.outputs.available == 'true'
        run: pnpm parity
        env:
          CLICKTRAIL_WP_PLUGIN_ROOT: ${{ steps.plugin.outputs.root }}

      - name: Enforce required parity (workflow_dispatch only)
        if: inputs.require_parity == true && steps.plugin.outputs.available != 'true'
        run: |
          echo "::error::require_parity=true but click-trail-handler is unavailable."
          exit 1

      - name: npm pack + clean-room install smoke
        run: | # zizmor: ignore[adhoc-packages] -- local release tarballs are the consumer-test subjects
          mkdir -p /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-core pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-browser pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-astro pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-nuxt pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-sveltekit pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-server pack --pack-destination /tmp/clicktrail-packs
          pnpm --filter @vizuh/clicktrail-formbricks pack --pack-destination /tmp/clicktrail-packs
          tools/release/verify-packed-internal-versions.sh /tmp/clicktrail-packs
          core_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-core-*.tgz' -printf '%f\n')"
          browser_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-browser-*.tgz' -printf '%f\n')"
          umbrella_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-[0-9]*.tgz' -printf '%f\n')"
          astro_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-astro-*.tgz' -printf '%f\n')"
          nuxt_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-nuxt-*.tgz' -printf '%f\n')"
          sveltekit_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-sveltekit-*.tgz' -printf '%f\n')"
          server_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-server-*.tgz' -printf '%f\n')"
          formbricks_tar="$(find /tmp/clicktrail-packs -maxdepth 1 -name 'vizuh-clicktrail-formbricks-*.tgz' -printf '%f\n')"
          cd "$(mktemp -d)"
          echo '{"name":"smoke","type":"module","private":true}' > package.json
          # zizmor: ignore[adhoc-packages] -- local release tarballs are the consumer-test subjects
          npm install --ignore-scripts --no-audit --no-fund \
            "/tmp/clicktrail-packs/$core_tar" \
            "/tmp/clicktrail-packs/$browser_tar" \
            "/tmp/clicktrail-packs/$umbrella_tar" \
            "/tmp/clicktrail-packs/$astro_tar" \
            "/tmp/clicktrail-packs/$nuxt_tar" \
            "/tmp/clicktrail-packs/$sveltekit_tar" \
            "/tmp/clicktrail-packs/$server_tar" \
            "/tmp/clicktrail-packs/$formbricks_tar" \
            --silent
          node --input-type=module -e "
            const mod = await import('@vizuh/clicktrail');
            const browser = await import('@vizuh/clicktrail/browser');
            const conv = await import('@vizuh/clicktrail/conversation');
            const agent = await import('@vizuh/clicktrail/agent');
            const otel = await import('@vizuh/clicktrail/otel');
            const apointoo = await import('@vizuh/clicktrail/apointoo');
            const incubating = await import('@vizuh/clicktrail/incubating');
            const astro = await import('@vizuh/clicktrail-astro');
            const nuxt = await import('@vizuh/clicktrail-nuxt');
            const sveltekit = await import('@vizuh/clicktrail-sveltekit');
            const server = await import('@vizuh/clicktrail-server');
            const formbricks = await import('@vizuh/clicktrail-formbricks');
            const checks = [
              ['root', mod.parseAttributionUrl],
              ['browser', browser.createClickTrail],
              ['conversation', conv.createConversationTracker],
              ['agent', agent.createAgentRunRecorder],
              ['otel', otel.otelDestination],
              ['apointoo', apointoo.createApointooDestination],
              ['incubating', incubating.ATTR_JOURNEY_ID],
              ['astro', astro.clicktrailAstro],
              ['nuxt', nuxt.defineClicktrailModule],
              ['sveltekit', sveltekit.clicktrail],
              ['server', server.ClickTrailServer],
              ['formbricks', formbricks.decorateFormbricksSurveyUrl],
            ];
            const missing = checks.filter(([, value]) => value === undefined).map(([name]) => name);
            if (missing.length) {
              console.error('Missing package exports:', missing.join(', '));
              process.exit(1);
            }
            console.log('pack smoke OK, exports', checks.map(([name]) => name).join(', '));
          "
