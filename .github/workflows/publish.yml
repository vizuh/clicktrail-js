name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  publish:
    name: Publish reviewed ClickTrail wave tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is reviewed master history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::tag commit is not in origin/master history"; exit 1;
          }
          merged_prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "master" and .merged_at != null)] | length')"
          test "$merged_prs" -gt 0 || {
            echo "::error::tag commit is not associated with a reviewed PR merged to master"; exit 1;
          }

      - name: Verify owner release authorization
        shell: bash
        run: |
          CLICKTRAIL_RELEASE_VERSION="${GITHUB_REF_NAME#v}" node tools/release/verify-release-authorization.mjs

      - name: Checkout pinned WordPress parity source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: vizuh/click-trail-handler
          ref: ead6682d6433c4f27309b7ee412e2dfc1fd50de4
          path: click-trail-handler
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        # zizmor: ignore[cache-poisoning] -- no dependency cache is enabled in this publish job
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm trusted-publishing runtime
        run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter @vizuh/clicktrail build:global
      - run: pnpm audit --prod --audit-level high

      - name: Install Chromium and run the golden probe
        run: |
          pnpm exec playwright install --with-deps chromium
          CLICKTRAIL_BROWSER=chromium pnpm probe

      - name: Enforce pinned WordPress runtime parity
        env:
          CLICKTRAIL_WP_PLUGIN_ROOT: ${{ github.workspace }}/click-trail-handler
        run: pnpm parity

      - name: Verify package bootstrap and immutable version state
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          for package_json in \
            packages/core/package.json \
            packages/browser/package.json \
            packages/clicktrail/package.json \
            integrations/astro/package.json \
            integrations/nuxt/package.json; do
            package_name="$(node -p "require('./$package_json').name")"
            package_version="$(node -p "require('./$package_json').version")"
            test "$tag_version" = "$package_version" || {
              echo "::error::version mismatch in $package_json: $package_version != $tag_version"; exit 1;
            }
            npm view "$package_name" version >/dev/null 2>&1 || {
              echo "::error::$package_name does not exist. Complete the one-time 2FA bootstrap and trusted-publisher setup first."; exit 1;
            }
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "::error::$package_name@$package_version already exists and is immutable"; exit 1;
            fi
          done

      - name: Pack the release artifacts once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/clicktrail-release-packs
          mkdir -p /tmp/clicktrail-release-packs
          pnpm --filter @vizuh/clicktrail-core pack --pack-destination /tmp/clicktrail-release-packs
          pnpm --filter @vizuh/clicktrail-browser pack --pack-destination /tmp/clicktrail-release-packs
          pnpm --filter @vizuh/clicktrail pack --pack-destination /tmp/clicktrail-release-packs
          pnpm --filter @vizuh/clicktrail-astro pack --pack-destination /tmp/clicktrail-release-packs
          pnpm --filter @vizuh/clicktrail-nuxt pack --pack-destination /tmp/clicktrail-release-packs
          test "$(find /tmp/clicktrail-release-packs -maxdepth 1 -name '*.tgz' | wc -l)" -eq 5
          tools/release/verify-packed-internal-versions.sh /tmp/clicktrail-release-packs
          sha256sum /tmp/clicktrail-release-packs/*.tgz | tee /tmp/clicktrail-release-packs/SHA256SUMS

      - name: Inspect and secret-scan packed artifacts
        shell: bash
        run: |
          set -euo pipefail
          scan_root="$(mktemp -d)"
          for tarball in /tmp/clicktrail-release-packs/*.tgz; do
            if tar -tzf "$tarball" | grep -E '(^|/)(\.env($|\.)|\.npmrc$|id_(rsa|ed25519)$|secrets?/|specs?/|docs/internal/)'; then
              echo "::error::forbidden release path in $tarball"; exit 1
            fi
            dest="$scan_root/$(basename "$tarball" .tgz)"
            mkdir -p "$dest"
            tar -xzf "$tarball" -C "$dest"
          done
          if grep -RIE --binary-files=without-match \
            -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|npm_[A-Za-z0-9]{20,}|//registry\.npmjs\.org/:_authToken=' \
            "$scan_root"; then
            echo "::error::credential-shaped content found in packed artifacts"; exit 1
          fi

      - name: Clean-room install and import the exact release artifacts
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] -- reviewed local tarballs are the release subjects
          set -euo pipefail
          core_tar="$(find /tmp/clicktrail-release-packs -name 'vizuh-clicktrail-core-*.tgz')"
          browser_tar="$(find /tmp/clicktrail-release-packs -name 'vizuh-clicktrail-browser-*.tgz')"
          umbrella_tar="$(find /tmp/clicktrail-release-packs -name 'vizuh-clicktrail-[0-9]*.tgz')"
          astro_tar="$(find /tmp/clicktrail-release-packs -name 'vizuh-clicktrail-astro-*.tgz')"
          nuxt_tar="$(find /tmp/clicktrail-release-packs -name 'vizuh-clicktrail-nuxt-*.tgz')"
          smoke="$(mktemp -d)"
          cd "$smoke"
          echo '{"name":"clicktrail-release-smoke","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts "$core_tar" "$browser_tar" "$umbrella_tar" "$astro_tar" "$nuxt_tar" --silent
          node --input-type=module <<'NODE'
          const root = await import('@vizuh/clicktrail');
          const browser = await import('@vizuh/clicktrail/browser');
          const astro = await import('@vizuh/clicktrail-astro');
          const nuxt = await import('@vizuh/clicktrail-nuxt');
          const checks = [root.parseAttributionUrl, browser.createClickTrail, astro.clicktrailAstro, nuxt.defineClicktrailModule];
          if (checks.some((value) => value === undefined)) throw new Error('missing packed export');
          NODE

      - name: Select npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/clicktrail/package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the exact reviewed tarballs with provenance
        env:
          NPM_DIST_TAG: ${{ steps.npm-dist-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for tarball in \
            /tmp/clicktrail-release-packs/vizuh-clicktrail-core-*.tgz \
            /tmp/clicktrail-release-packs/vizuh-clicktrail-browser-*.tgz \
            /tmp/clicktrail-release-packs/vizuh-clicktrail-[0-9]*.tgz \
            /tmp/clicktrail-release-packs/vizuh-clicktrail-astro-*.tgz \
            /tmp/clicktrail-release-packs/vizuh-clicktrail-nuxt-*.tgz; do
            npm publish "$tarball" --access public --provenance --tag "$NPM_DIST_TAG"
          done
