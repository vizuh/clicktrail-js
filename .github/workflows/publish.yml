name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ClickTrail wave (core, browser, umbrella, astro, nuxt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        # zizmor: ignore[cache-poisoning] -- no dependency cache is enabled in this publish job
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm trusted-publishing runtime
        run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @vizuh/clicktrail build:global
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Verify npm package bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          for package_json in \
            packages/core/package.json \
            packages/browser/package.json \
            packages/clicktrail/package.json \
            integrations/astro/package.json \
            integrations/nuxt/package.json; do
            package_name="$(node -p "require('./$package_json').name")"
            if ! npm view "$package_name" version >/dev/null 2>&1; then
              echo "::error::$package_name does not exist on npm. Complete Hugo's one-time 2FA bootstrap and configure its trusted publisher before retrying this release."
              exit 1
            fi
          done

      - name: Verify tag matches every published package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for package_json in \
            packages/clicktrail/package.json \
            packages/core/package.json \
            packages/browser/package.json \
            integrations/astro/package.json \
            integrations/nuxt/package.json; do
            package_version="$(node -p "require('./$package_json').version")"
            test "$tag_version" = "$package_version" || {
              echo "version mismatch in $package_json: $package_version != $tag_version"; exit 1;
            }
          done

      - name: Select npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/clicktrail/package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish wave to npm with trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.npm-dist-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            packages/core \
            packages/browser \
            packages/clicktrail \
            integrations/astro \
            integrations/nuxt; do
            echo "Publishing from $dir"
            (cd "$dir" && npm publish --access public --provenance --tag "$NPM_DIST_TAG")
          done
