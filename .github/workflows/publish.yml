name: Publish (disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    name: Publishing disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo "npm publishing is intentionally disabled until governance, provenance, and npm scope gates pass."

