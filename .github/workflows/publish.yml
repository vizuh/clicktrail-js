name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @vizuh/clicktrail
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm trusted-publishing CLI
        run: npm install --global npm@11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r exec tsc -p tsconfig.json --noEmit
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/clicktrail/package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Publish to npm with trusted publishing
        run: npm publish --access public
        working-directory: packages/clicktrail
