name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @vizuh/clicktrail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        # zizmor: ignore[cache-poisoning] -- no dependency cache is enabled in this publish job
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm trusted-publishing runtime
        run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @vizuh/clicktrail build:global
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for package_json in packages/clicktrail/package.json packages/astro/package.json; do
            package_version="$(node -p "require('./$package_json').version")"
            test "$tag_version" = "$package_version"
          done

      - name: Select npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/clicktrail/package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.npm-dist-tag.outputs.tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        working-directory: packages/clicktrail
