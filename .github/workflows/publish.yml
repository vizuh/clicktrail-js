#
# PRECONDITIONS (from docs/ARCHITECTURE.md, "One-way doors") — verify ALL
# before removing comments and enabling this workflow:
#
#   1. SCOPE OWNERSHIP: confirm the `@funnelsheet` npm scope is owned by the
#      funnelsheet org and that trusted publishing is registered for this
#      repository + workflow + environment on npmjs.com.
#   2. COPYRIGHT PROVENANCE: complete the contributor copyright chain
#      verification required before licensing the code MIT. The WP plugin
#      stays GPL-2.0-or-later; MIT embedding must be clean of unreviewed
#      third-party contributions.
#   3. VERSIONING GATES: every payload carries `schema_version` (additive)
#      and `classifier_version` (semantic). A classifier behavior change may
#      only ship as a MAJOR release; check fixtures for recorded semver
#      decisions before publishing.
#
# To enable: delete the leading `# ` from every line, add an `environment`
# matching the npm trusted-publisher configuration, and tag-trigger it.
